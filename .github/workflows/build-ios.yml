name: Build iOS ipa

# Produces an UNSIGNED .ipa for sideloading with AltStore.
#
# Unsigned is deliberate: AltStore strips and re-signs anything it installs with
# the user's own certificate, so a signature here would be thrown away. It also
# means this workflow needs no certificates, no provisioning profiles, and no
# secrets in the repo.
#
# Must run on macos-26. Godot 4.7.1's iOS template links against iOS 26 APIs
# (MTLTensor, MTLResidencySet, NSProcessPerformanceProfile), so anything older
# fails at the link step with undefined symbols for arm64.

on:
  workflow_dispatch:

# One build at a time. Two concurrent runs each cut a release and then race to
# commit the manifest — the loser hits a merge conflict and the manifest is left
# pointing at whichever build happened to finish first, which is not necessarily
# the newest code. Queue them instead.
concurrency:
  group: ios-build
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.1
  BUNDLE_ID: com.jay.beachgas

jobs:
  build:
    runs-on: macos-26
    # Needed to publish the release and to push the regenerated manifest back.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true

      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          set -eux
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fL -o godot.zip  "$BASE/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          curl -fL -o tpl.tpz    "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          ls -la

      - name: Install export templates
        run: |
          set -eux
          DEST="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$DEST"
          unzip -q tpl.tpz -d tpl
          mv tpl/templates/* "$DEST"/
          ls "$DEST" | head -20

      - name: Write export preset
        run: |
          cat > export_presets.cfg <<'PRESET'
          [preset.0]

          name="iOS"
          platform="iOS"
          runnable=true
          advanced_options=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="ios/beachgas.xcodeproj"
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          application/app_store_team_id="CZRX4PZM2B"
          application/bundle_identifier="com.jay.beachgas"
          application/code_sign_identity_debug="Apple Development"
          application/code_sign_identity_release="Apple Development"
          application/signature=""
          application/short_version=""
          application/version=""
          application/min_ios_version="14.0"
          application/additional_plist_content=""
          PRESET
          cat export_presets.cfg

      - name: Export Xcode project
        run: |
          set -eux
          GODOT=./Godot.app/Contents/MacOS/Godot
          chmod +x "$GODOT"
          mkdir -p ios
          # Import first so the project has a resource cache, then export.
          "$GODOT" --headless --path . --import || true
          # Godot 4.7 doesn't just generate an Xcode project — it then runs
          # xcodebuild itself, which fails here because the runner has no signing
          # certificate. We only want the generated project; we build it ourselves
          # unsigned in a later step. So the export's own failure is expected and
          # not fatal. What matters is that the .xcodeproj exists afterwards.
          "$GODOT" --headless --path . --export-release "iOS" ios/beachgas.xcodeproj || true
          test -d ios/beachgas.xcodeproj || { echo "no Xcode project was generated"; exit 1; }
          find ios -maxdepth 2 -print | head -40

      - name: Add local network permission to Info.plist
        run: |
          set -eux
          # Godot writes additional_plist_content into the ENTITLEMENTS file, not
          # Info.plist. NSLocalNetworkUsageDescription is an Info.plist key, and
          # without it iOS 14+ silently blocks all device-to-device traffic — the
          # lobby just stays empty with no error. So we set it here directly.
          PLIST=$(find ios -name "*-Info.plist" -o -name "Info.plist" | head -1)
          echo "patching: $PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSLocalNetworkUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string Beach Gas uses your local network to find and play with nearby players." "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSLocalNetworkUsageDescription" "$PLIST"

      - name: Build
        run: |
          set -eux
          cd ios
          xcodebuild \
            -project beachgas.xcodeproj \
            -target beachgas \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/out" \
            build

      - name: Package ipa
        run: |
          set -eux
          cd ios
          mkdir -p Payload
          cp -R out/beachgas.app Payload/
          zip -qry beachgas.ipa Payload
          ls -lh beachgas.ipa

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: beachgas-ipa
          path: ios/beachgas.ipa
          if-no-files-found: error

      # ----------------------------------------------------------------------
      # AltStore source. Everything below turns this build into something the
      # phones can install themselves.
      #
      # AltStore reads a JSON manifest from a public URL and offers an Update
      # button when the version string changes. The .ipa has to be publicly
      # downloadable — AltStore can't authenticate — which is why the repo is
      # public.
      #
      # Installing still needs AltServer reachable on the same WiFi, because
      # AltStore doesn't sign apps itself. This removes the "Jay hands everyone
      # a file" step, not the "Jay's laptop is in the room" one.
      # ----------------------------------------------------------------------

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          VERSION=$(grep -E '^config/version=' project.godot | cut -d'"' -f2)
          # Run number appended so every build is a new version. Without it
          # AltStore sees the same 1.2.0 it already has and offers nothing.
          BUILD="${VERSION}.${{ github.run_number }}"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          ICON=$(find ios/Payload/beachgas.app -maxdepth 1 -name "*180x180*.png" | head -1 || true)
          if [ -z "$ICON" ]; then
            ICON=$(find ios/Payload/beachgas.app -maxdepth 1 -name "*.png" | head -1 || true)
          fi
          if [ -n "$ICON" ]; then cp "$ICON" beachgas-icon.png; fi
          gh release create "v$BUILD" ios/beachgas.ipa ${ICON:+beachgas-icon.png} \
            --title "Beach Gas $BUILD" \
            --notes "Automated build from ${GITHUB_SHA}" \
            --latest

      - name: Write AltStore manifest
        run: |
          set -eux
          SIZE=$(stat -f%z ios/beachgas.ipa)
          DATE=$(date -u +%Y-%m-%d)
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${BUILD}"
          cat > altstore.json <<JSON
          {
            "name": "Beach Gas",
            "identifier": "com.jay.beachgas.source",
            "subtitle": "Your phone is the weapon.",
            "apps": [
              {
                "name": "Beach Gas: Cellular Warfare",
                "bundleIdentifier": "com.jay.beachgas",
                "developerName": "Sapphire Signal",
                "subtitle": "Zap them, track them, call them.",
                "localizedDescription": "A first-person duel where your phone is the weapon. Up to 8 players over local WiFi, no internet required.",
                "iconURL": "${BASE}/beachgas-icon.png",
                "tintColor": "E84A55",
                "category": "games",
                "versions": [
                  {
                    "version": "${BUILD}",
                    "date": "${DATE}",
                    "size": ${SIZE},
                    "downloadURL": "${BASE}/beachgas.ipa",
                    "minOSVersion": "14.0",
                    "localizedDescription": "Automated build."
                  }
                ]
              }
            ]
          }
          JSON
          python3 -m json.tool altstore.json > /dev/null   # fail loudly on bad JSON
          cat altstore.json

      - name: Commit manifest
        run: |
          set -eu
          cp altstore.json "$RUNNER_TEMP/manifest.json"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The manifest is entirely generated, so a merge conflict in it is
          # meaningless — the version we just built is always the right answer.
          # Reset onto whatever the remote has and lay ours back on top rather
          # than rebasing into a conflict, and retry if someone pushes in
          # between the fetch and the push.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/manifest.json" altstore.json
            git add altstore.json
            if git diff --cached --quiet; then
              echo "manifest unchanged"
              exit 0
            fi
            git commit -m "AltStore manifest for ${BUILD}"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push raced with another run, retrying ($attempt)"
          done
          echo "could not publish manifest after 3 attempts"
          exit 1

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            ios/**/*.log
          if-no-files-found: ignore
